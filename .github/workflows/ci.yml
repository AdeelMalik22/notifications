name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: notifications.settings.local
      DJANGO_SECRET_KEY: ci-only-7gVQ2mZ9xK4pR8sT1wY6nC3dF5hJ0-not-for-deployment
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost
      POSTGRES_DB: notifications_ci
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: ci-postgres-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/1
      CELERY_BROKER_URL: amqp://notifications:ci-rabbitmq-password@127.0.0.1:5672//

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: notifications_ci
          POSTGRES_USER: notifications
          POSTGRES_PASSWORD: ci-postgres-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notifications -d notifications_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:4.3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: notifications
          RABBITMQ_DEFAULT_PASS: ci-rabbitmq-password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.18
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy apps notifications tests manage.py

      - name: Run tests with coverage
        run: >-
          uv run pytest
          --cov=apps
          --cov=notifications
          --cov-report=term-missing
          --cov-report=xml
          --cov-fail-under=85

      - name: Check Django configuration
        run: uv run python manage.py check --settings=notifications.settings.test

      - name: Check production security settings
        run: >-
          uv run python manage.py check
          --deploy
          --fail-level WARNING
          --settings=notifications.settings.production

      - name: Check migration consistency
        run: >-
          uv run python manage.py makemigrations
          --check
          --dry-run
          --settings=notifications.settings.test

      - name: Apply and verify PostgreSQL migrations
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py migrate --check

      - name: Exercise PostgreSQL and Redis readiness
        run: >-
          uv run python manage.py shell -c
          "from apps.health.checks import run_readiness_checks;
          result = run_readiness_checks();
          assert result == {'database': 'ok', 'cache': 'ok'}, result;
          print(result)"

      - name: Validate OpenAPI schema
        run: >-
          uv run python manage.py spectacular
          --validate
          --file /tmp/notificationos-schema.yml
          --settings=notifications.settings.test

      - name: Exercise Celery through RabbitMQ
        shell: bash
        run: |
          set -euo pipefail

          worker_log="$(mktemp)"
          worker_node="ci-worker@$(hostname)"
          uv run celery -A notifications worker \
            --pool=solo \
            --queues=ci \
            --loglevel=INFO \
            --hostname="${worker_node}" \
            --logfile="${worker_log}" &
          worker_pid=$!
          cleanup() {
            kill "${worker_pid}" 2>/dev/null || true
            wait "${worker_pid}" 2>/dev/null || true
            rm -f "${worker_log}"
          }
          trap cleanup EXIT

          worker_ready=false
          for attempt in $(seq 1 30); do
            if uv run celery -A notifications inspect ping \
              --destination="${worker_node}" \
              --timeout=2 2>/dev/null \
              | grep -F pong >/dev/null; then
              worker_ready=true
              break
            fi
            sleep 1
          done

          if [[ "${worker_ready}" != "true" ]]; then
            sed -n '1,240p' "${worker_log}"
            exit 1
          fi

          uv run celery -A notifications inspect registered \
            --destination="${worker_node}" \
            --timeout=5 \
            | grep -F notificationos.system.health_ping >/dev/null

          task_id="$(
            uv run python manage.py shell -c \
              "from apps.common.tasks import health_ping; print(health_ping.apply_async(queue='ci').id)" \
              | tail -n 1
          )"

          task_succeeded=false
          for attempt in $(seq 1 20); do
            if grep -Fq \
              "Task notificationos.system.health_ping[${task_id}] succeeded" \
              "${worker_log}"; then
              task_succeeded=true
              break
            fi
            sleep 1
          done

          if [[ "${task_succeeded}" != "true" ]]; then
            sed -n '1,240p' "${worker_log}"
            exit 1
          fi

      - name: Validate Compose configuration
        run: docker compose config --quiet

  image:
    name: Production image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag notificationos:ci .

      - name: Verify image user and Django configuration
        run: |
          test "$(
            docker image inspect \
              --format '{{.Config.User}}' \
              notificationos:ci
          )" = "notificationos"
          docker run --rm \
            --env DJANGO_SETTINGS_MODULE=notifications.settings.test \
            --env DJANGO_SECRET_KEY=ci-container-check \
            notificationos:ci \
            python manage.py check

      - name: Boot Gunicorn and probe liveness
        shell: bash
        run: |
          set -euo pipefail

          container_id="$(
            docker run --detach \
              --publish 127.0.0.1:18000:8000 \
              --env DJANGO_SECRET_KEY=ci-container-runtime-check \
              --env DJANGO_ALLOWED_HOSTS=127.0.0.1,localhost \
              notificationos:ci
          )"
          cleanup() {
            docker rm --force "${container_id}" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          web_ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:18000/health/live >/dev/null; then
              web_ready=true
              break
            fi
            sleep 1
          done

          if [[ "${web_ready}" != "true" ]]; then
            docker logs "${container_id}"
            exit 1
          fi

  security:
    name: Dependency, secret, and container scanning
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: 0.11.18
          enable-cache: true

      - name: Audit locked Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv export --frozen --no-dev --format requirements-txt \
            | uvx --from pip-audit pip-audit --strict --requirement -

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production image for scanning
        run: docker build --tag notificationos:security .

      - name: Scan production image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: notificationos:security
          format: table
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: 1
